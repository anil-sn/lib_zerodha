[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lib_zerodha"
version = "1.0.0"
authors = [
  {name = "Anil Kumar S N", email = "anilkumarsn@example.com"},
]
description = "Comprehensive Kite Connect API library with advanced trading features"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10", 
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
keywords = [
    "kite", "zerodha", "trading", "api", "stock-market", 
    "futures", "options", "derivatives", "NSE", "BSE", "NFO", "BFO",
    "algorithmic-trading", "quantitative-finance", "portfolio-management"
]
dependencies = [
    "requests>=2.28.0",
    "websocket-client>=1.4.0", 
    "pandas>=1.5.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
analysis = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "ta-lib>=0.4.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.3.0",
]
database = [
    "sqlalchemy>=2.0.0", 
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.28.0",
]
performance = [
    "uvloop>=0.17.0; platform_system != 'Windows'",
    "orjson>=3.9.0",
    "msgpack>=1.0.0",
    "lz4>=4.3.0",
]
all = [
    "lib_zerodha[dev,analysis,database,performance]"
]

[project.urls]
Homepage = "https://github.com/anilkumarsn/lib_zerodha"
Documentation = "https://github.com/anilkumarsn/lib_zerodha/blob/main/README.md"
Repository = "https://github.com/anilkumarsn/lib_zerodha"
Changelog = "https://github.com/anilkumarsn/lib_zerodha/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/anilkumarsn/lib_zerodha/issues"

[project.scripts]
lib-zerodha = "lib_zerodha.cli:main"

[tool.hatch.version]
path = "lib_zerodha/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lib_zerodha"]

[tool.hatch.build.targets.sdist]
include = [
    "/lib_zerodha",
    "/examples", 
    "/docs",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

# Development Tools Configuration
[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "B018", "E501"]

[tool.black]
target-version = ["py39", "py310", "py311", "py312"]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "websocket.*",
    "ta.*",
    "matplotlib.*",
    "seaborn.*", 
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=lib_zerodha",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests that require API credentials",
]

[tool.coverage.run]
source = ["lib_zerodha"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/docs/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]